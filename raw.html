ng_the_rental_property\":\"One-time fee to the real estate agency for securing the rental property.\",\"one_time_payment_to_a_guarantor_company_acting_as_a_lease_co_signer\":\"One-time payment to a guarantor company acting as a lease co-signer.\",\"estimated_cost_for_fire_insurance_covering_damages_and_liability\":\"Estimated cost for fire insurance, covering damages and liability.\",\"one_time_fee_for_changing_locks_and_keys_upon_move_in\":\"One-time fee for changing locks and keys upon move-in.\",\"estimated_initial_cost_combining_all_fees_may_vary_inquire_for_exact_amounts\":\"Estimated initial cost combining all fees; may vary, inquire for exact amounts.\",\"rental_fees\":\"Rental fees\",\"confirm_your_email\":\"Confirm your email\",\"as_a_first_step_you_need_to_verify_your_email\":\"As a first step, you need to verify your email.\",\"log_out_here\":\"log out here\",\"click_here\":\"Click here\",\"to_receive_a_verification_link\":\"to receive a verification link.\",\"if_needed_you_can\":\"If needed, you can\",\"dot\":\".\",\"appliances\":\"Appliances\",\"minimum_stay_months\":\"Minimum stay (months)\",\"brokerage_fee\":\"Brokerage fee\",\"month\":\"Month\",\"inquire_property\":\"Inquire about this property\",\"available_from\":\"Available from\",\"reservation_dates\":\"Reservation dates\",\"select_dates_to_calculate_prices\":\"Select dates to calculate prices\",\"rent_per_month\":\"Rent per month\",\"contact_info\":\"Contact info\",\"detail_url\":\"Detail URL\",\"agent\":\"Agent\",\"views_across_sns\":\"Views across SNS\",\"happy_clients\":\"Happy clients\",\"agents\":\"Agents\",\"about_description_2\":\"Every member of our diverse team plays a crucial role in E-Housing's mission to empower agents, clients and partners. We combine local expertise with global perspectives to break down barriers and create opportunities for all.\",\"about_description_3\":\"Together, we're not just serving the market - we're reshaping it. By leveraging innovative technology and personalized service, we're building a more accessible, transparent, and efficient real estate experience in Japan.\",\"understanding_and_addressing_the_needs_of_our_clients_staff_and_community_is_at_the_heart_of_everything_we_do_we_strive_to_listen_actively_and_respond_thoughtfully_ensuring_that_all_interactions_are_handled_with_care_and_consideration_this_empathetic_approach_allows_us_to_connect_more_deeply_with_our_clients_and_to_provide_solutions_that_truly_meet_their_needs\":\"Understanding and addressing the needs of our clients, staff, and community is at the heart of everything we do. We strive to listen actively and respond thoughtfully, ensuring that all interactions are handled with care and consideration. This empathetic approach allows us to connect more deeply with our clients and to provide solutions that truly meet their needs.\",\"equality_is_intrinsic_to_our_corporate_identity_we_believe_that_everyone_regardless_of_their_background_should_have_equal_access_to_the_best_real_estate_opportunities_this_commitment_to_fairness_drives_us_to_create_an_inclusive_environment_where_everyone_s_voice_is_heard_and_valued,_promoting_diversity_throughout_our_operations\":\"Equality is intrinsic to our corporate identity. We believe that everyone, regardless of their background, should have equal access to the best real estate opportunities. This commitment to fairness drives us to create an inclusive environment where everyone's voice is heard and valued, promoting diversity throughout our operations.\",\"trust_is_the_foundation_of_our_relationships_with_clients_partners_and_staff_we_cultivate_trust_through_transparency_integrity_and_accountability_in_all_our_dealings_by_consistently_upholding_these_standards_we_ensure_that_e_housing_is_a_reliable_and_dependable_partner_in_all_aspects_of_real_estate\":\"Trust is the foundation of our relationships with clients, partners, and staff. We cultivate trust through transparency, integrity, and accountability in all our dealings. By consistently upholding these standards, we ensure that E-Housing is a reliable and dependable partner in all aspects of real estate.\",\"we_are_committed_to_leading_the_industry_through_innovation_at_e_housing_we_continuously_explore_new_ideas_technologies_and_methods_to_enhance_the_real_estate_experience_our_dedication_to_innovation_ensures_that_we_are_always_at_the_forefront_offering_cutting_edge_solutions_that_set_new_standards_in_the_market\":\"We are committed to leading the industry through innovation. At E-Housing, we continuously explore new ideas, technologies, and methods to enhance the real estate experience. Our dedication to innovation ensures that we are always at the forefront, offering cutting-edge solutions that set new standards in the market.\",\"days\":\"days\",\"day\":\"day\",\"sale_price_min\":\"Sale price min\",\"sale_price_max\":\"Sale price max\",\"short_term_rent_amount_min\":\"Short term rent amount min\",\"short_term_rent_amount_max\":\"Short term rent amount max\",\"move_in\":\"Move-in\",\"move_out\":\"Move-out\",\"add_appliance\":\"Add appliance\",\"edit_appliance\":\"Edit appliance\",\"please_enter_full_name\":\"Please enter full name\",\"please_enter_email\":\"Please enter email\",\"apartments_for_short_term_rent\":\"Apartments for short-term rent\",\"my_favorites_apartments_for_short_term_rent\":\"My favorites - Apartments for short-term rent\",\"at_e_housing_we_guide_buyers_from_all_backgrounds_to_find_homes_they_ll_cherish_from_securing_financing_to_the_final_closing_our_dedicated_team_is_here_to_clarify_all_your_options_represent_your_interests_and_support_you_through_every_step_of_your_home_buying_journey\":\"At E-Housing, we guide buyers from all backgrounds to find homes they'll cherish. From securing financing to the final closing, our dedicated team is here to clarify all your options, represent your interests, and support you through every step of your home-buying journey.\",\"selling_a_home_can_be_both_emotional_and_stressful_with_our_deep_local_expertise_effective_marketing_strategies_and_compassionate_advice_we_ensure_your_selling_experience_is_smooth_and_stress_free\":\"Selling a home can be both emotional and stressful. With our deep local expertise, effective marketing strategies, and compassionate advice, we ensure your selling experience is smooth and stress-free.\",\"our_advanced_search_filters_allow_you_to_narrow_your_search_to_find_exactly_what_you_want_such_as_rooftop_balcony_or_pet_friendly_options_save_time_and_discover_your_perfect_rental_with_our_daily_updated_listings_all_foreigner_friendly_and_up_to_date\":\"Our advanced search filters allow you to narrow your search to find exactly what you want, such as 'rooftop balcony' or pet-friendly options. Save time and discover your perfect rental with our daily updated listings—all foreigner-friendly and up-to-date.\",\"we_offer_a_wide_selection_of_fully_furnished_short_term_apartments_available_for_immediate_move_in_complete_all_procedures_online_with_ease_and_settle_into_your_new_home_as_quickly_as_possible\":\"We offer a wide selection of fully furnished short-term apartments, available for immediate move-in. Complete all procedures online with ease, and settle into your new home as quickly as possible.\",\"finding_the_right_tenant_requires_precise_pricing_strategic_advertising_property_showings_thorough_document_screening_reference_checks_negotiations_and_lease_preparation_trust_our_experienced_brokerage_firm_to_expertly_guide_you_through_this_comprehensive_process\":\"Finding the right tenant requires precise pricing, strategic advertising, property showings, thorough document screening, reference checks, negotiations, and lease preparation. Trust our experienced brokerage firm to expertly guide you through this comprehensive process.\",\"how_do_you_ensure_your_properties_are_up_to_date_daily\":\"How do you ensure your properties are up-to-date daily?\",\"our_system_unlike_japanese_portals_like_suumo_or_at_home_is_directly_connected_to_property_management_websites_this_ensures_that_we_display_only_foreigner_friendly_places_and_keep_our_database_continuously_updated_with_the_latest_listings\":\"Our system, unlike Japanese portals like SUUMO or AtHome, is directly connected to property management websites. This ensures that we display only foreigner-friendly places and keep our database continuously updated with the latest listings.\",\"can_you_help_with_obtaining_a_mortgage_in_japan\":\"Can you help with obtaining a mortgage in Japan?\",\"absolutely_we_assist_buyers_in_securing_financing_by_connecting_them_with_banks_and_financial_institutions_that_offer_mortgage_options_for_foreigners_we_ll_guide_you_through_the_application_process_and_help_you_understand_all_your_options\":\"Absolutely. We assist buyers in securing financing by connecting them with banks and financial institutions that offer mortgage options for foreigners. We'll guide you through the application process and help you understand all your options.\",\"do_you_offer_english_speaking_agents_and_services\":\"Do you offer English-speaking agents and services?\",\"yes_we_offer_english_speaking_agents_and_services_to_ensure_that_our_international_clients_have_a_smooth_and_hassle_free_experience_our_agents_are_fluent_both_in_english_\u0026_japanese_and_well_versed_in_the_unique_needs_of_expatriates_we_can_assist_you_with_every_step_of_the_rental_process_from_finding_the_right_neighborhood_to_understanding_the_lease_terms_and_setting_up_utilities_our_goal_is_to_make_your_transition_to_living_in_tokyo_as_seamless_as_possible\":\"Yes, we offer English-speaking agents and services to ensure that our international clients have a smooth and hassle-free experience. Our agents are fluent both in English \u0026 Japanese and well-versed in the unique needs of expatriates. We can assist you with every step of the rental process, from finding the right neighborhood to understanding the lease terms and setting up utilities. Our goal is to make your transition to living in Tokyo as seamless as possible.\",\"can_a_foreigner_buy_an_apartment_in_japan\":\"Can a foreigner buy an apartment in Japan?\",\"yes_foreigners_can_buy_apartments_in_japan_without_any_restrictions_at_e_housing_real_estate_agency_we_offer_comprehensive_support_to_international_buyers_throughout_the_entire_purchasing_process_our_english_speaking_agents_will_help_you_navigate_the_property_market_understand_legal_requirements_and_manage_all_necessary_paperwork_we_also-provide_assistance_with_financing_options_and_can_connect_you_with_trusted_legal_and_financial_advisors_our_aim_is_to_make_your_property_purchase_in_japan_as_smooth_and_transparent_as_possible\":\"Yes, foreigners can buy apartments in Japan without any restrictions. At E-Housing Real Estate Agency, we offer comprehensive support to international buyers throughout the entire purchasing process. Our English-speaking agents will help you navigate the property market, understand legal requirements, and manage all necessary paperwork. We also provide assistance with financing options and can connect you with trusted legal and financial advisors. Our aim is to make your property purchase in Japan as smooth and transparent as possible.\",\"what_areas_do_you_focus_on\":\"What areas do you focus on?\",\"we_primarily_focus_on_central_tokyo_specializing_in_the_wards_of_shinjuku_shibuya_minato_chiyoda_chuo_and_meguro_however_depending_on_the_case_we_may_also_be_able_to_support_clients_in_other_regions_feel_free_to_contact_us_to_discuss_your_specific_needs_and_location_preferences\":\"We primarily focus on central Tokyo, specializing in the wards of Shinjuku, Shibuya, Minato, Chiyoda, Chuo, and Meguro. However, depending on the case, we may also be able to support clients in other regions. Feel free to contact us to discuss your specific needs and location preferences.\",\"are_there_any_hidden_fees\":\"Are there any hidden fees?\",\"no_there_are_no_hidden_fees_we_believe_in_transparent_pricing_and_will_provide_a_clear_breakdown_of_all_costs_involved_upfront_our_goal_is_to_ensure_you_have_a_complete_understanding_of_all_expenses_related_to_your_real_estate_transaction_with_no_surprises_along_the_way\":\"No, there are no hidden fees. We believe in transparent pricing and will provide a clear breakdown of all costs involved upfront. Our goal is to ensure you have a complete understanding of all expenses related to your real estate transaction, with no surprises along the way.\",\"rental_categories\":\"Rental Categories\",\"discover_tokyo_wards\":\"Discover Tokyo Wards\",\"none\":\"None\",\"terms_not_accepted\":\"Terms not accepted\",\"copied_successfully\":\"Copied successfully\",\"privacy_paragraph_1\":\"This Privacy Policy describes Our policies and procedures on the collection, use and disclosure of Your information when You use the Service and tells You about Your privacy rights and how the law protects You.\",\"privacy_paragraph_2\":\"We use Your Personal data to provide and improve the Service. By using the Service, You agree to the collection and use of information in accordance with this Privacy Policy. This Privacy Policy has been created with the help of the\",\"privacy_paragraph_3\":\"The words of which the initial letter is capitalized have meanings defined under the following conditions. The following definitions shall have the same meaning regardless of whether they appear in singular or in plural.\",\"privacy_paragraph_4\":\"While using Our Service, We may ask You to provide Us with certain personally identifiable information that can be used to contact or identify You. Personally identifiable information may include, but is not limited to:\",\"privacy_paragraph_5\":\"Usage Data is collected automatically when using the Service.\",\"privacy_paragraph_6\":\"Usage Data may include information such as Your Device's Internet Protocol address (e.g. IPaddress), browser type, browser version, the pages of our Service that You visit, the time and date of Your visit, the time spent on those pages, unique device identifiers and other diagnostic data.\",\"privacy_paragraph_7\":\"When You access the Service by or through a mobile device, We may collect certain inform a Your mobile device unique ID, the IP address of Your mobile device, Your mobile operating system, the type of mobile Internet browser You use, unique device identifiers and other diagnostic data.\",\"privacy_paragraph_8\":\"We may also collect information that Your browser sends whenever You visit our Service or when You access the Service by or through a mobile device.\",\"privacy_paragraph_9\":\"Information from Third-Party Social Media Services\",\"privacy_paragraph_10\":\"The Company allows You to create an account and log in to use the Service through the following Third-party Social Media Services:\",\"privacy_paragraph_11\":\"If You decide to register through or otherwise grant us access to a Third-Party Social Media Service, We may collect Personal data that is already associated with Your Third-Party Social Media Service's account, such as Your name, Your email address, Your activities or Your contact list associated with that account.\",\"privacy_paragraph_12\":\"You may also have the option of sharing additional information with the Company through Your Third-Party Social Media Service's account. If You choose to provide such information and Personal Data, during registration or otherwise, You are giving the Company permission to use, share, and store it in a manner consistent with this Privacy Policy.\",\"privacy_paragraph_13\":\"We use Cookies and similar tracking technologies to track the activity on Our Service and store certain information. Tracking technologies used are beacons, tags, and scripts to collect and track information and to improve and analyze Our Service. The technologies We use may include:\",\"privacy_paragraph_14\":\"Cookies or Browser Cookies. A cookie is a small file placed on Your Device. You can instruct Your browser to refuse all Cookies or to indicate when a Cookie is being sent. However, if You do not accept Cookies, You may not be able to use some parts of our Service. Unless you have adjusted Your browser setting so that it will refuse Cookies, our Service may use Cookies.\",\"privacy_paragraph_15\":\"Flash Cookies. Certain features of our Service may use local stored objects (or Flash Cookies) to collect and store information about Your preferences or Your activity on our Service. Flash Cookies are not managed by the same browser settings as those used for Browser Cookies. For more information on how You can delete Flash Cookies, please read Where can I change the settings for disabling, or deleting local shared objects? available at\",\"privacy_paragraph_16\":\"Web Beacons. Certain sections of our Service and our emails may contain small electronic files known as web beacons (also referred to as clear gifs, pixel tags, and single-pixel gifs) that permit the Company, for example, to count users who have visited those pages or opened an email and for other related website statistics (for example, recording the popularity of a certain section and verifying system and server integrity).\",\"privacy_paragraph_17\":\"Cookies can be 'Persistent' or 'Session' Cookies. Persistent Cookies remain on Your personal computer or mobile device when You go offline, while Session Cookies are deleted as soon as You close Your web browser. You can learn more about cookies here:\",\"privacy_paragraph_18\":\"We use both Session and Persistent Cookies for the purposes set out below:\",\"privacy_paragraph_19\":\"Purpose: These Cookies are essential to provide You with services available through the Website and to enable You to use some of its features. They help to authenticate users and prevent fraudulent use of user accounts. Without these Cookies, the services that You have asked for cannot be provided, and We only use these Cookies to provide You with those services.\",\"privacy_paragraph_20\":\"Purpose: These Cookies identify if users have accepted the use of cookies on the Website.\",\"privacy_paragraph_21\":\"Purpose: These Cookies allow us to remember choices You make when You use the Website, such as remembering your login details or language preference. The purpose of these Cookies is to provide You with a more personal experience and to avoid You having to re-enter your preferences every time You use the Website.\",\"privacy_paragraph_22\":\"For more information about the cookies we use and your choices regarding cookies, please visit our Cookies Policy or the Cookies section of our Privacy Policy.\",\"privacy_paragraph_23\":\"The Company may use Personal Data for the following purposes:\",\"privacy_paragraph_24\":\"To provide and maintain our Service, including to monitor the usage of our Service.\",\"privacy_paragraph_25\":\"To manage Your Account: to manage Your registration as a user of the Service. The Personal Data You provide can give You access to different functionalities of the Service that are available to You as a registered user.\",\"privacy_paragraph_26\":\"For the performance of a contract: the development, compliance and undertaking of the purchase contract for the products, items or services You have purchased or of any other contract with Us through the Service.\",\"privacy_paragraph_27\":\"To contact You: To contact You by email, telephone calls, SMS, or other equivalent forms of electronic communication, such as a mobile application's push notifications regarding updates or informative communications related to the functionalities, products or contracted services, including the security updates, when necessary or reasonable for their implementation.\",\"privacy_paragraph_28\":\"To provide You with news, special offers and general information about other goods, services and events which we offer that are similar to those that you have already purchased or enquired about unless You have opted not to receive such information.\",\"privacy_paragraph_29\":\"To manage Your requests: To attend and manage Your requests to Us.\",\"privacy_paragraph_30\":\"For business transfers: We may use Your information to evaluate or conduct a merger, divestiture, restructuring, reorganization, dissolution, or other sale or transfer of some or all of Our assets, whether as a going concern or as part of bankruptcy, liquidation, or similar proceeding, in which Personal Data held by Us about our Service users is among the assets transferred.\",\"privacy_paragraph_31\":\"For other purposes: We may use Your information for other purposes, such as data analysis, identifying usage trends, determining the effectiveness of our promotional campaigns and to evaluate and improve our Service, products, services, marketing and your experience.\",\"privacy_paragraph_32\":\"We may share Your personal information in the following situations:\",\"privacy_paragraph_33\":\"With Service Providers: We may share Your personal information with Service Providers to monitor and analyze the use of our Service, to contact You.\",\"privacy_paragraph_34\":\"For business transfers: We may share or transfer Your personal information in connection with, or during negotiations of, any merger, sale of Company assets, financing, or acquisition of all or a portion of Our business to another company.\",\"privacy_paragraph_35\":\"With Affiliates: We may share Your information with Our affiliates, in which case we will require those affiliates to honor this Privacy Policy. Affiliates include Our parent company and any other subsidiaries, joint venture partners or other companies that We control or that are under common control with Us.\",\"privacy_paragraph_36\":\"With business partners: We may share Your information with Our business partners to offer You certain products, services or promotions.\",\"privacy_paragraph_37\":\"With other users: when You share personal information or otherwise interact in the public areas with other users, such information may be viewed by all users and may be publicly distributed outside. If You interact with other users or register through a Third-Party Social Media Service, Your contacts on the Third-Party Social Media Service may see Your name, profile, pictures and description of Your activity. Similarly, other users will be able to view descriptions of Your activity, communicate with You and view Your profile.\",\"privacy_paragraph_38\":\"With Your consent: We may disclose Your personal information for any other purpose with Your consent.\",\"privacy_paragraph_39\":\"The Company will retain Your Personal Data only for as long as is necessary for the purposes set out in this Privacy Policy. We will retain and use Your Personal Data to the extent necessary to comply with our legal obligations (for example, if we are required to retain your data to comply with applicable laws), resolve disputes, and enforce our legal agreements and policies.\",\"privacy_paragraph_40\":\"The Company will also retain Usage Data for internal analysis purposes. Usage Data is generally retained for a shorter period of time, except when this data is used to strengthen the security or to improve the functionality of Our Service, or We are legally obligated to retain this data for longer time periods.\",\"privacy_paragraph_41\":\"Your information, including Personal Data, is processed at the Company's operating offices and in any other places where the parties involved in the processing are located. It means that this information may be transferred to — and maintained on — computers located outside of Your state, province, country or other governmental jurisdiction where the data protection laws may differ than those from Your jurisdiction.\",\"privacy_paragraph_42\":\"Your consent to this Privacy Policy followed by Your submission of such information represents Your agreement to that transfer.\",\"privacy_paragraph_43\":\"The Company will take all steps reasonably necessary to ensure that Your data is treated securely and in accordance with this Privacy Policy and no transfer of Your Personal Data will take place to an organization or a country unless there are adequate controls in place including the security of Your data and other personal information.\",\"privacy_paragraph_44\":\"If the Company is involved in a merger, acquisition or asset sale, Your Personal Data may be transferred. We will provide notice before Your Personal Data is transferred and becomes subject to a different Privacy Policy.\",\"privacy_paragraph_45\":\"Under certain circumstances, the Company may be required to disclose Your Personal Data if required to do so by law or in response to valid requests by public authorities (e.g. a court or a government agency).\",\"privacy_paragraph_46\":\"The Company may disclose Your Personal Data in the good faith belief that such action is necessary to:\",\"privacy_paragraph_47\":\"Comply with a legal obligation\",\"privacy_paragraph_48\":\"Protect and defend the rights or property of the Company\",\"privacy_paragraph_49\":\"Prevent or investigate possible wrongdoing in connection with the Service\",\"privacy_paragraph_50\":\"Protect the personal safety of Users of the Service or the public\",\"privacy_paragraph_51\":\"Protect against legal liability\",\"privacy_paragraph_52\":\"The security of Your Personal Data is important to Us, but remember that no method of transmission over the Internet, or method of electronic storage is 100% secure. While We strive to use commercially acceptable means to protect Your Personal Data, We cannot guarantee its absolute security.\",\"privacy_paragraph_53\":\"Our Service does not address anyone under the age of 13. We do not knowingly collect personally identifiable information from anyone under the age of 13. If You are a parent or guardian and You are aware that Your child has provided Us with Personal Data, please contact Us. If We become aware that We have collected Personal Data from anyone under the age of 13 without verification of parental consent, We take steps to remove that information from Our servers.\",\"privacy_paragraph_54\":\"If We need to rely on consent as a legal basis for processing Your information and Your country requires consent from a parent, We may require Your parent's consent before We collect and use that information.\",\"privacy_paragraph_55\":\"Our Service may contain links to other websites that are not operated by Us. If You click on a third party link, You will be directed to that third party's site. We strongly advise You to review the Privacy Policy of every site You visit.\",\"privacy_paragraph_56\":\"We have no control over and assume no responsibility for the content, privacy policies or practices of any third party sites or services.\",\"privacy_paragraph_57\":\"We may update Our Privacy Policy from time to time. We will notify You of any changes by posting the new Privacy Policy on this page.\",\"privacy_paragraph_58\":\"We will let You know via email and/or a prominent notice on Our Service, prior to the change becoming effective and update the 'Last updated' date at the top of this Privacy Policy.\",\"privacy_paragraph_59\":\"You are advised to review this Privacy Policy periodically for any changes. Changes to this Privacy Policy are effective when they are posted on this page.\",\"privacy_paragraph_60\":\"If you have any questions about this Privacy Policy, You can contact us:\",\"privacy_paragraph_61\":\"By email: \",\"privacy_title\":\"Privacy Policy\",\"privacy_heading_1\":\"Interpretation and Definitions\",\"privacy_heading_2\":\"Interpretation\",\"privacy_heading_3\":\"Collecting and Using Your Personal Data\",\"privacy_heading_4\":\"Types of Data Collected\",\"privacy_heading_5\":\"First name and last name\",\"privacy_heading_6\":\"Cookies by TermsFeed Generator.\",\"privacy_heading_7\":\"Necessary / Essential Cookies\",\"privacy_heading_8\":\"Type: Session Cookies\",\"privacy_heading_9\":\"Administe raph_69\":\"Service Provider means any natural or legal person who processes the data on behalf of the Company. It refers to third-party companies or individuals employed by the Company to facilitate the Service, to provide the Service on behalf of the Company, to perform services related to the Service or to assist the Company in analyzing how the Service is used.\",\"privacy_paragraph_70\":\"Third-party Social Media Service refers to any website or any social network website through which a User can log in or create an account to use the Service.\",\"privacy_paragraph_71\":\"Usage Data refers to data collected automatically, either generated by the use of the Service or from the Service infrastructure itself (for example, the duration of a page visit).\",\"privacy_paragraph_72\":\" Website refers to E-Housing, accessible from\",\"privacy_paragraph_73\":\"You means the individual accessing or using the Service, or the company, or other legal entity on behalf of which such individual is accessing or using the Service, as applicable.\",\"privacy_heading_25\":\"Definitions\",\"privacy_heading_26\":\"For the purposes of this Privacy Policy:\",\"home_listing_text\":\"Discover a vast selection of properties in Tokyo. Whether you're looking for a cozy apartment or a luxurious home.\",\"home_agents_text\":\"Our team of experienced agents is here to assist you every step of the way, ensuring a smooth and stress-free property search.\",\"home_rating_text\":\"Our exceptional service and customer satisfaction have earned us the highest ratings. Join countless happy clients who found their dream home with us.\",\"use_the_form_below_to_connect_with_us\":\"Use the form below to connect with us.\",\"biggest_amount_of_listings\":\"Biggest amount of listings\",\"updated_every_day\":\"Updated every day\",\"all_foreigner_friendly\":\"All foreigner friendly\",\"expert_agents_for_full_support\":\"Expert agents for full support\",\"instant_booking_system\":\"Instant booking system\",\"ta ment\":\"Continuous Improvement\",\"compliance_policy\":\"Compliance policy\",\"anti_corruption\":\"Anti-Corruption\",\"business_ethics\":\"Business Ethics\",\"human_rights_protection\":\"Human Rights Protection\",\"environmental_protection\":\"Environmental Protection\",\"decent_working_conditions\":\"Decent Working Conditions\",\"sanctions_compliance\":\"Sanctions Compliance\",\"competition_compliance\":\"Competition Compliance\",\"compliance_policy_paragraph_1\":\"Our company steadfastly opposes corruption in all its forms, including bribery, embezzlement, and fraud. We adhere strictly to anti-corruption laws and foster a culture of transparency and accountability. All employees and officers are required to avoid any actions that could be perceived as corrupt, and to report any suspicions of corruption in accordance with our reporting procedures.\",\"compliance_policy_paragraph_2\":\"We are dedicated to maintaining the highest standards of business ethics and conduct. This involves ensuring fair dealings with all stakeholders, including customers, suppliers, and competitors. We conduct our business with integrity, avoiding conflicts of interest, and ensuring that our decisions are made in the best interest of our stakeholders and in compliance with applicable laws and regulations.\",\"compliance_policy_paragraph_3\":\"We are committed to protecting human rights and ensuring that our business operations do not contribute to human rights abuses. This includes respecting the rights of our employees, providing a workplace free from discrimination and harassment, and ensuring that our supply chain practices uphold human rights standards.\",\"compliance_policy_paragraph_4\":\"Our commitment to environmental protection is integral to our business operations. We strive to minimize our environmental impact by implementing sustainable practices, reducing waste, conserving resources, and promoting environmental awareness among our employees and partners.\",\"compliance_poli
